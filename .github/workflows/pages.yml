# Publica a pasta site-publico/ no GitHub Pages a cada push na main que mexa nela.
# Em Settings -> Pages, a "Source" precisa estar em "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
    paths: ["site-publico/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-publico
      - id: deploy
        uses: actions/deploy-pages@v4
