<title>Diagnóstico Turístico · Montanhas Capixabas</title>
<meta name="description" content="Painel do diagnóstico da oferta turística de Alfredo Chaves (ES), no padrão visual do P01 do Power BI.">
<!--
  painel-p01.html — Diagnóstico turístico de Alfredo Chaves, 13 páginas, no padrão visual do
  "P01 - Montanhas Capixabas.pbix" (tema "Padrão BI": faixa de navegação verde-petróleo,
  título com pílula laranja, filtros laranja, tabelas em tom areia), refinado: canvas de
  1600x900, cartões com espaçamento de 16 px, KPIs com ícone, gaveta de filtros com
  multisseleção e contagem, mapas de calor, barras de proporção e exportação das tabelas.

  Dados: os blocos <script type="text/plain"> são copiados do index.html pelo
  gerar_painel.py. Nada aqui é digitado à mão. A exceção é o bloco "pontos-folder": a
  localização de cada lugar, tirada do folder turístico (PDF georreferenciado do QGIS). O
  gerar_painel.py não o substitui; para atualizar, troque as linhas do bloco.

  Mapas: Leaflet 1.9.4 (BSD-2-Clause) e leaflet.heat 0.2.0 (MIT), embutidos. Fundo:
  OpenStreetMap quando publicado; Esri World Street Map quando aberto como arquivo.

  Ícones: Phosphor Icons 2.1 (https://phosphoricons.com), licença MIT,
  Copyright (c) 2023 Phosphor Icons. Embutidos no script (constante ICONES).

  Atualizar os dados:  python site-publico/gerar_site.py  e depois
                       python site-publico/gerar_painel.py
-->

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --entorno: #161B1A; } }
:root[data-theme="dark"] { --entorno: #161B1A; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--entorno); font-family: var(--fonte); color: var(--texto); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }

}

/* ---------- faixa de navegação ---------- */
.faixa {
  position: absolute; left: 0; top: 0; bottom: 0; width: 72px; z-index: 40;
  background: linear-gradient(180deg, var(--verde-faixa), var(--verde-faixa-2));
  display: flex; flex-direction: column; align-items: stretch; padding: 14px 0 12px;
  transition: width .22s ease, box-shadow .22s;
}
.faixa.larga { width: 284px; box-shadow: 8px 0 30px rgba(0,0,0,.25); }

.marca .selo { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.12); display: grid; place-items: center; flex: none; }
.marca .selo svg { width: 30px; height: 18px; }

.nav { display: flex; flex-direction: column; gap: 4px; padding: 0 12px; }
.nav button {
  position: relative; display: flex; align-items: center; gap: 14px; height: 48px; border: 0; border-radius: 12px;

}

.nav button.ativo { background: #fff; color: var(--verde-escuro); font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.nav button.ativo::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--laranja); }
.faixa-pe { margin-top: auto; padding: 0 12px; }

.veu.on { opacity: 1; visibility: visible; }

/* ---------- cabeçalho ---------- */
.cabecalho { position: absolute; left: 72px; right: 0; top: 0; height: 92px; display: flex; align-items: center; gap: 18px; padding: 0 24px 0 32px; }
.cab-txt { min-width: 0; }
.sobre-titulo { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--texto-3); font-weight: 600; }
.cab-txt h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; color: var(--verde-escuro); letter-spacing: -.2px; }
.pilula { width: 44px; height: 6px; border-radius: 3px; background: var(--laranja); margin-top: 7px; }
.cab-dir { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: nowrap; overflow: hidden; max-width: 760px; justify-content: flex-end; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 15px;
  background: var(--laranja-tinta); color: #8A3D0A; border: 1px solid #F8D3B6; font-size: 12.5px; white-space: nowrap; max-width: 260px;
}
.chip.sel { background: var(--verde-tinta); color: var(--verde-escuro); border-color: #BFE0D9; }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.chip b { font-weight: 600; }
.chip button { width: 20px; height: 20px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: inherit; padding: 0; }
.chip button:hover { background: rgba(0,0,0,.08); }
.chip svg.i { font-size: 12px; }
.atualizado { font-size: 12px; color: var(--texto-3); white-space: nowrap; text-align: right; line-height: 1.35; }
.atualizado b { display: block; color: var(--texto-2); font-weight: 600; }
.btn-filtros {
  position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px 0 14px; border-radius: 21px;
  border: 0; background: var(--laranja-filtro); color: #fff; font-size: 14.5px; font-weight: 600; box-shadow: 0 3px 10px rgba(255,124,67,.35);
}
.btn-filtros:hover { background: #F46A2E; }
.btn-filtros svg.i { font-size: 20px; }
.btn-filtros .qtd { min-width: 22px; height: 22px; border-radius: 11px; background: #fff; color: #C2410C; font-size: 12px; display: grid; place-items: center; padding: 0 6px; }

/* ---------- conteúdo: grade de 12 colunas ---------- */
.conteudo { position: absolute; left: 104px; right: 24px; top: 100px; bottom: 22px; }
.grade { height: 100%; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.cartao {
  background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; box-shadow: var(--sombra);
  display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px 16px 12px; position: relative;
}
.c-cab { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; min-height: 24px; }
.c-ico { width: 30px; height: 30px; border-radius: 9px; background: var(--verde-tinta); color: var(--verde-faixa); display: grid; place-items: center; flex: none; }
.c-ico svg.i { font-size: 18px; }
.c-tit { min-width: 0; flex: 1; }
.c-tit h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--texto); line-height: 1.25; }
.c-tit p { margin: 1px 0 0; font-size: 12px; color: var(--texto-3); line-height: 1.3; }
.c-acoes { display: flex; gap: 6px; align-items: center; flex: none; }
.c-corpo { flex: 1; min-height: 0; position: relative; }
.c-nota { margin-top: 6px; font-size: 11.5px; color: var(--texto-3); display: flex; gap: 6px; align-items: center; }
.c-nota svg.i { font-size: 13px; }
.btn-mini {
  height: 28px; border: 1px solid var(--borda); background: #fff; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px;
  padding: 0 8px; font-size: 12px; color: var(--texto-2);
}
.btn-mini:hover { background: var(--trilho); }
.btn-mini svg.i { font-size: 15px; }
.tb-barra { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; }
.tb-cont { margin-left: auto; font-size: 11.5px; color: var(--texto-3); white-space: nowrap; }
.busca-mini { position: relative; flex: 1; max-width: 300px; }
.busca-mini input {
  height: 30px; width: 100%; border: 1px solid var(--borda); border-radius: 8px; padding: 0 8px 0 28px; font-size: 12.5px; background: #fff; color: var(--texto);
}
.busca-mini svg.i { position: absolute; left: 9px; top: 8px; font-size: 14px; color: var(--texto-3); }
.vazio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--texto-3); font-size: 13px; padding: 10px; }
.legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--texto-2); align-items: center; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* KPI */
.kpi { padding: 14px 16px; flex-direction: row; gap: 14px; align-items: flex-start; }
.kpi .k-ico { width: 46px; height: 46px; border-radius: 12px; background: var(--verde-tinta); color: var(--verde-faixa); display: grid; place-items: center; flex: none; }
.kpi .k-ico svg.i { font-size: 26px; }
.kpi .k-ico.laranja { background: var(--laranja-tinta); color: #D9631A; }
.kpi .k-txt { flex: 1; min-width: 0; }
.kpi .k-rot { font-size: 13px; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .k-val { font-size: 30px; font-weight: 700; color: var(--verde-escuro); line-height: 1.12; letter-spacing: -.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .k-val small { font-size: 15px; font-weight: 600; color: var(--texto-2); letter-spacing: 0; margin-left: 4px; }
.kpi .k-pe { margin-top: 7px; }
.k-barra { height: 6px; border-radius: 3px; background: var(--trilho); display: flex; overflow: hidden; gap: 2px; }
.k-barra button { border: 0; padding: 0; height: 100%; }
.k-sub { font-size: 11.5px; color: var(--texto-3); margin-top: 5px; display: flex; gap: 10px; white-space: nowrap; overflow: hidden; }
.k-pe > .k-sub:only-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; line-height: 1.35; }
.k-sub i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; }

/* barras horizontais */
.hb { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-around; overflow: hidden; }
.hb-l {
  display: grid; grid-template-columns: var(--rot, 34%) 1fr; gap: 10px; align-items: center; border: 0; background: none; padding: 1px 0;
  text-align: left; border-radius: 6px; min-height: 0;
}
.hb-l:hover { background: #F6F9F8; }
.hb-r { font-size: 12.5px; color: var(--texto-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-t { position: relative; height: var(--alt, 18px); background: var(--trilho); border-radius: 5px; display: flex; align-items: center; min-width: 0; }
.hb-b { height: 100%; background: var(--barra); border-radius: 5px; min-width: 3px; transition: width .35s ease, opacity .2s; }
.hb-v { position: absolute; left: calc(var(--w) + 6px); font-size: 12px; color: var(--texto); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hb-v small { font-weight: 400; color: var(--texto-3); margin-left: 4px; }
.hb-v.dentro { left: auto; right: calc(100% - var(--w) + 6px); color: #fff; }
.hb-v.dentro small { color: rgba(255,255,255,.8); }
.apagado { opacity: .32; }

/* colunas */
.cb { position: absolute; inset: 0; display: flex; flex-direction: column; }
.cb-area { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 10px; position: relative; border-bottom: 1px solid var(--borda); }
.cb-grade { position: absolute; left: 0; right: 0; border-top: 1px dashed #E8EDEC; }
.cb-c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border: 0; background: none; padding: 0; min-width: 0; position: relative; z-index: 1; border-radius: 6px 6px 0 0; }
.cb-c:hover { background: #F6F9F8; }
.cb-v { font-size: 12px; font-weight: 600; color: var(--texto); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.cb-b { width: min(64%, 56px); background: var(--barra); border-radius: 6px 6px 0 0; min-height: 3px; transition: height .35s ease, opacity .2s; }
.cb-rots { display: flex; gap: 10px; padding-top: 6px; }
.cb-r { flex: 1; min-width: 0; font-size: 11.5px; color: var(--texto-2); text-align: center; line-height: 1.15; height: 28px; overflow: hidden; }

/* proporções (barras 100%) */
.pr { position: absolute; inset: 0; display: flex; flex-direction: column; }
.pr-linhas { flex: 1; display: flex; flex-direction: column; justify-content: space-around; min-height: 0; }
.pr-l { display: grid; grid-template-columns: var(--rot, 40%) 1fr; gap: 12px; align-items: center; }
.pr-r { font-size: 12.5px; color: var(--texto-2); line-height: 1.2; }
.pr-r small { display: block; color: var(--texto-3); font-size: 11px; }
.pr-b { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; background: #fff; }
.pr-b button { border: 0; padding: 0; height: 100%; font-size: 11px; font-weight: 600; color: #fff; overflow: hidden; white-space: nowrap; min-width: 2px; transition: opacity .2s; }
.pr-b button.claro { color: var(--texto); }

/* rosca */
.rs { position: absolute; inset: 0; display: flex; align-items: center; gap: 14px; }
.rs svg { height: 100%; max-height: 210px; max-width: 58%; aspect-ratio: 1; flex: 0 1 auto; min-width: 0; }
.fatia { cursor: pointer; transition: opacity .2s; stroke: #fff; stroke-width: 2; }
.rs-centro-n { font-size: 30px; font-weight: 700; fill: var(--verde-escuro); font-family: var(--fonte); }
.rs-centro-t { font-size: 12px; fill: var(--texto-3); font-family: var(--fonte); }
.rs-leg { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1 1 0; }
.rs-leg button { display: grid; grid-template-columns: 12px 1fr; gap: 3px 10px; border: 0; background: none; text-align: left; padding: 4px 6px; border-radius: 8px; }
.rs-leg button:hover { background: #F6F9F8; }
.rs-leg i { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; }
.rs-leg b { font-size: 13px; color: var(--texto); font-weight: 600; }
.rs-leg span { grid-column: 2; font-size: 12px; color: var(--texto-3); }

/* linha */
.ln { position: absolute; inset: 0; }
.ln svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ln-p { cursor: pointer; }
.ln text { font-family: var(--fonte); }

/* mapa de calor */
.ht { position: absolute; inset: 0; overflow: auto; }
.ht table { border-collapse: separate; border-spacing: 3px; width: 100%; table-layout: fixed; }
.ht th { font-size: 11.5px; font-weight: 600; color: var(--texto-2); padding: 2px 1px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ht th.lin { text-align: right; font-weight: 400; width: var(--rot, 30%); }
.ht td { padding: 0; height: var(--alt, 30px); border-radius: 5px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; transition: outline-color .15s; outline: 2px solid transparent; outline-offset: -2px; }
.ht td:hover { outline-color: var(--laranja); }
.ht td.marcada { outline-color: var(--laranja); }

/* tabela */
.tb-w { position: absolute; inset: 0; display: flex; flex-direction: column; border: 1px solid var(--areia-borda); border-radius: 10px; overflow: hidden; }
.tb { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; }
.tb-tot { flex: none; overflow: hidden; scrollbar-gutter: stable; border-top: 2px solid var(--areia-borda); background: #fff; }
.tb table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12.5px; }
.tb-tot table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12.5px; }
.tb th {
  position: sticky; top: 0; z-index: 1; background: var(--areia); color: var(--marrom); font-weight: 600; font-size: 12px; text-align: left;
  padding: 8px 10px; border-bottom: 1px solid var(--areia-borda); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; user-select: none;
}
.tb th:hover { background: #F0EBE4; }
.tb th .seta { color: var(--laranja); margin-left: 4px; font-size: 10px; }
.tb td, .tb-tot td { padding: 6px 10px; color: var(--texto); border-bottom: 1px solid #F3EEE8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-tot td { font-weight: 700; color: var(--verde-escuro); border: 0; }
.tb tbody tr:nth-child(even) td { background: #FBF9F6; }
.tb tbody tr:hover td { background: #EEF6F4; }
.tb tbody tr.clicavel { cursor: pointer; }
.tb tbody tr.marcada td { background: var(--verde-tinta) !important; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.tb td.sub { padding-left: 34px; color: var(--texto-2); }
.exp { border: 0; background: var(--trilho); color: var(--verde-escuro); width: 18px; height: 18px; border-radius: 5px; padding: 0; margin-right: 6px; vertical-align: -3px; display: inline-grid; place-items: center; }
.exp svg.i { font-size: 11px; }
.ok { color: var(--verde); display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--verde-tinta); }
.ok svg.i { font-size: 12px; }
.nada { color: #C7CFCD; }
.tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; background: var(--trilho); color: var(--texto-2); margin-right: 3px; }
.tag.rural { background: var(--verde-tinta); color: var(--verde-escuro); }
.tag.urbana { background: var(--laranja-tinta); color: #8A3D0A; }

/* mapa */
.mp { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, #F6F8F7, #EEF2F0); }
.mp > svg { width: 100%; height: 100%; display: block; }
.d-forma { stroke: #fff; stroke-width: 1.6; cursor: pointer; transition: opacity .2s, fill .3s; }
.d-forma:hover { stroke: var(--laranja); stroke-width: 3; }
.d-forma.sel { stroke: var(--laranja); stroke-width: 4; }
.d-forma.fora { opacity: .35; }
.d-nome { font-size: 15px; font-weight: 700; fill: var(--verde-escuro); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; font-family: var(--fonte); }
.d-num { font-size: 13px; font-weight: 600; fill: var(--texto-2); paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; font-family: var(--fonte); }
.mp-zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; border-radius: 9px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.mp-zoom button { width: 32px; height: 32px; border: 0; border-bottom: 1px solid var(--borda); background: #fff; display: grid; place-items: center; color: var(--texto-2); padding: 0; }
.mp-zoom button:last-child { border-bottom: 0; }
.mp-zoom button:hover { background: var(--trilho); }
.mp-zoom svg.i { font-size: 16px; }
.mp-leg { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.92); border-radius: 9px; padding: 7px 10px; font-size: 11px; color: var(--texto-2); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.mp-leg .esc { display: flex; gap: 2px; margin: 4px 0 2px; }
.mp-leg .esc i { width: 24px; height: 8px; border-radius: 2px; }
.mp-leg .lim { display: flex; justify-content: space-between; color: var(--texto-3); }

/* conceito */
.guia { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.passo { display: flex; gap: 12px; align-items: flex-start; background: var(--verde-escuro); color: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: var(--sombra); }
.passo .n { width: 40px; height: 40px; border-radius: 11px; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
.passo .n svg.i { font-size: 22px; }
.passo b { display: block; font-size: 14.5px; margin-bottom: 3px; }
.passo span { font-size: 12.5px; line-height: 1.4; opacity: .88; }
.def p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--texto-2); }
.def p b { color: var(--verde-escuro); }
.def .c-ico { width: 40px; height: 40px; border-radius: 11px; }
.def .c-ico svg.i { font-size: 22px; }
.def .c-tit h2 { font-size: 16px; padding-top: 9px; }

/* ---------- gaveta de filtros ---------- */
.gaveta {
  position: absolute; top: 0; right: 0; bottom: 0; width: 380px; z-index: 50; background: #fff;
  box-shadow: -10px 0 34px rgba(0,0,0,.18); display: flex; flex-direction: column;
  transform: translateX(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1); visibility: hidden;
}
.gaveta.aberta { transform: none; visibility: visible; }
.g-cab { height: 64px; flex: none; background: var(--laranja-filtro); color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-radius: 0 0 0 18px; }
.g-cab svg.i { font-size: 22px; }
.g-cab h2 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; }
.g-cab button { width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; color: #fff; display: grid; place-items: center; padding: 0; }
.g-cab button:hover { background: rgba(255,255,255,.2); }
.g-res { padding: 12px 20px; font-size: 13px; color: var(--texto-2); border-bottom: 1px solid var(--borda); display: flex; align-items: center; gap: 8px; }
.g-res b { color: var(--verde-escuro); font-size: 15px; }
.g-busca { padding: 12px 20px 4px; position: relative; }
.g-busca input { width: 100%; height: 40px; border: 1px solid var(--borda); border-radius: 10px; padding: 0 12px 0 36px; font-size: 14px; background: var(--canvas); color: var(--texto); }
.g-busca input:focus { background: #fff; border-color: var(--verde-claro); outline: none; box-shadow: 0 0 0 3px var(--verde-tinta); }
.g-busca svg.i { position: absolute; left: 32px; top: 24px; font-size: 16px; color: var(--texto-3); }
.g-corpo { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
.g-sec { border-bottom: 1px solid var(--borda); padding: 12px 0; }
.g-sec:last-child { border-bottom: 0; }
.g-sec-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.g-sec-cab h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--texto-2); font-weight: 600; }
.g-dica { margin: -4px 0 8px; font-size: 12px; color: var(--texto-3); line-height: 1.35; }
.g-sec-cab button { border: 0; background: none; font-size: 12px; color: #C2410C; padding: 2px 4px; }
.opcoes { display: flex; flex-direction: column; gap: 2px; }
.op { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; border: 0; background: none; text-align: left; font-size: 13.5px; color: var(--texto); }
.op:hover { background: var(--canvas); }
.op .cx { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #AEB8B6; display: grid; place-items: center; color: #fff; }
.op[aria-checked="true"] .cx { background: var(--laranja-filtro); border-color: var(--laranja-filtro); }
.op .cx svg.i { font-size: 12px; opacity: 0; }
.op[aria-checked="true"] .cx svg.i { opacity: 1; }
.op .n { font-size: 12px; color: var(--texto-3); font-variant-numeric: tabular-nums; }
.op.zero { color: var(--texto-3); }
.seg-ctl { display: flex; background: var(--canvas); border-radius: 10px; padding: 3px; gap: 3px; }
.seg-ctl button { flex: 1; height: 34px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; color: var(--texto-2); }
.seg-ctl button[aria-pressed="true"] { background: #fff; color: var(--verde-escuro); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.g-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.g-chips button { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--borda); background: #fff; font-size: 12.5px; color: var(--texto-2); display: inline-flex; align-items: center; gap: 6px; }
.g-chips button svg.i { font-size: 15px; }
.g-chips button[aria-pressed="true"] { background: var(--laranja-tinta); border-color: #F8C9A6; color: #9A3F08; font-weight: 600; }
.g-pe { flex: none; padding: 14px 20px; border-top: 1px solid var(--borda); display: flex; gap: 10px; }
.g-pe button { flex: 1; height: 42px; border-radius: 10px; font-size: 14px; font-weight: 600; }
.g-pe .sec { border: 1px solid var(--borda); background: #fff; color: var(--texto-2); }
.g-pe .pri { border: 0; background: var(--verde-escuro); color: #fff; }

/* dica (tooltip) */
.dica {
  position: fixed; z-index: 1000; pointer-events: none; max-width: 300px; background: #1F2B29; color: #fff;
  border-radius: 10px; padding: 9px 12px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;

var EMP = {}; EMPS.forEach(function (e) { EMP[e.id_empreendimento] = e; });
var SEGS = tabela("dim_segmento").sort(function (a, b) { return num(a.ordem_chip) - num(b.ordem_chip); });
var SEG_ID = {}, SEG_NOME = {}; SEGS.forEach(function (s) { SEG_ID[s.id_segmento] = s; SEG_NOME[s.segmento] = s; });
var CURTO_SEG = { "Alimentação": "Comer", "Hospedagem": "Dormir", "Recursos Naturais": "Natureza", "Agroindústria": "Produtos",
  "Compras": "Compras", "Entretenimento/Aventura": "Aventura", "Cultural": "Cultura" };

var CONVS = tabela("dim_conveniencia").sort(function (a, b) { return num(a.ordem_conveniencia) - num(b.ordem_conveniencia); });
var CONV_ID = {}; CONVS.forEach(function (c) { CONV_ID[c.id_conveniencia] = c; });
var CURTO_CONV = { cartao: "Cartão", estac: "Estac.", pet: "Pet", infantil: "Infantil", acess: "Acessível", idioma: "Idioma", feriado: "Feriado" };
var ICONE_CONV = { cartao: "credit-card", estac: "car", pet: "paw-print", infantil: "baby", acess: "wheelchair", idioma: "translate", feriado: "calendar-check" };
var INDS = {}; tabela("dim_indicador").forEach(function (i) { INDS[i.id_indicador] = i; });
function indexar(linhas, k, v) { var m = {}; linhas.forEach(function (l) { (m[l[k]] = m[l[k]] || []).push(l[v]); }); return m; }
var SEG_DE = indexar(tabela("ponte_empreendimento_segmento"), "id_empreendimento", "id_segmento");

function segsDe(e) {
  return (SEG_DE[e.id_empreendimento] || []).map(function (id) { return SEG_ID[id]; }).filter(Boolean)
    .sort(function (a, b) { return num(a.ordem_chip) - num(b.ordem_chip); });
}
function rotSeg(e) { return segsDe(e).map(function (s) { return s.rotulo_visitante; }); }

var FATO = {}, ORDEM = {};
tabela("fato_indicador").forEach(function (f) {
  var porId = FATO[f.id_indicador] = FATO[f.id_indicador] || {};
  var l = porId[f.id_empreendimento] = porId[f.id_empreendimento] || [];
  if (l.indexOf(f.categoria) < 0) { l.push(f.categoria); }
  var o = ORDEM[f.id_indicador] = ORDEM[f.id_indicador] || {};
  if (!(f.categoria in o) || num(f.ordem_categoria) < o[f.categoria]) { o[f.categoria] = num(f.ordem_categoria); }
});
function catsDe(ind, e) { return (FATO[ind] && FATO[ind][e.id_empreendimento]) || []; }
function categorias(ind) { var o = ORDEM[ind] || {}; return Object.keys(o).sort(function (a, b) { return o[a] - o[b] || porNome(a, b); }); }

/* carta dos distritos (OSM / IBGE 3200300), a mesma do index.html */
function decodificar(s) {
  var i = 0, lat = 0, lng = 0, pts = [];
  while (i < s.length) {
    for (var k = 0; k < 2; k++) {
      var d0 = 0, res = 0, b;
      do { b = s.charCodeAt(i++) - 63; res |= (b & 0x1f) << d0; d0 += 5; } while (b >= 0x20);
      var d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (k === 0) { lat += d; } else { lng += d; }
    }
    pts.push([lat / 1e4, lng / 1e4]);
  }
  return pts;
}
var DISTRITOS = parseCSV(bloco("geo-distritos")).map(function (l) {
  return { distrito: l.distrito, oficial: l.nome_oficial, sede: [num(l.sede_lat), num(l.sede_lon)], anel: decodificar(l.contorno) };
}).filter(function (d) { return d.anel.length > 3; });
var LIM = { s: 90, n: -90, o: 180, l: -180 };
DISTRITOS.forEach(function (d) { d.anel.forEach(function (p) { LIM.s = Math.min(LIM.s, p[0]); LIM.n = Math.max(LIM.n, p[0]); LIM.o = Math.min(LIM.o, p[1]); LIM.l = Math.max(LIM.l, p[1]); }); });
var ATUALIZADO = bloco("meta-atualizado");

/* ==================================================================
   2. Eixos (o que cada visual conta), filtros e seleção
   ================================================================== */
function eixo(k) {
  if (k === "seg") { return { cats: SEGS.map(function (s) { return s.rotulo_visitante; }), de: rotSeg,
    curto: function (v) { var s = SEGS.filter(function (x) { return x.rotulo_visitante === v; })[0]; return s ? CURTO_SEG[s.segmento] || v : v; } }; }
  if (k === "distrito") { return { cats: REGS, de: function (e) { return [e.distrito]; } }; }
  if (k === "zona") { return { cats: ["Rural", "Urbana"], de: function (e) { return zona(e) ? [zona(e)] : []; } }; }
  if (k === "conv") { return { cats: CONVS.map(function (c) { return c.id_conveniencia; }), de: function (e) { return CONV_DE[e.id_empreendimento] || []; },
    rot: function (v) { return (CONV_ID[v] || {}).conveniencia || v; }, curto: function (v) { return CURTO_CONV[v] || v; } }; }
  if (k === "cartao") { return { cats: ["Sim", "Não"], de: function (e) { return [sim(e.aceita_cartao) ? "Sim" : "Não"]; } }; }
  var ind = k.indexOf("ind:") === 0 ? k.slice(4) : k;
  return { cats: categorias(ind), de: function (e) { return catsDe(ind, e); } };
}
function rotulo(k, v) { var ex = eixo(k); return ex.rot ? ex.rot(v) : v; }
var CURTO_CAT = { "Revsol/Brita": "Revsol", "Outras respostas": "Outras", "Não informou": "N/inf." };
function curto(k, v) { var ex = eixo(k); return ex.curto ? ex.curto(v) : (CURTO_CAT[v] || rotulo(k, v)); }

/* filtros da gaveta: valem para todas as páginas. Dentro de um grupo vale "ou";
   entre grupos, "e". Conveniências: o lugar precisa ter todas as marcadas. */
var GRUPOS = [
  { k: "seg", tit: "Categoria", tipo: "lista" },
  { k: "distrito", tit: "Distrito", tipo: "lista" },
  { k: "zona", tit: "Zona", tipo: "segmentado" },
  { k: "conv", tit: "O lugar oferece", tipo: "chips", todos: true },
  { k: "ind:via", tit: "Tipo de via até o local", tipo: "lista" },
  { k: "ind:recursos_acess", tit: "Recursos de acessibilidade", tipo: "lista", todos: true }
];
var filtro = { busca: "", seg: [], distrito: [], zona: [], conv: [], "ind:via": [], "ind:recursos_acess": [] };
var selecao = {};     /* por página: { k, v } ou { par: [{k,v},{k,v}] } */

function passaGrupo(e, g, valores) {
  if (!valores || !valores.length) { return true; }
  var tem = eixo(g.k).de(e);
  return g.todos ? valores.every(function (v) { return tem.indexOf(v) >= 0; }) : valores.some(function (v) { return tem.indexOf(v) >= 0; });
}
function passaSel(e, s) {
  if (!s) { return true; }
  if (s.par) { return s.par.every(function (p) { return eixo(p.k).de(e).indexOf(p.v) >= 0; }); }
  if (s.k === "emp") { return e.id_empreendimento === s.v; }
  return eixo(s.k).de(e).indexOf(s.v) >= 0;
}
function chaveSel(s) { return s ? (s.par ? "par:" + s.par[0].k + "|" + s.par[1].k : s.k) : ""; }
/* opts.ignorar: chave de seleção que o próprio visual não aplica;
   opts.semGrupo: grupo de filtro ignorado (para as contagens da gaveta);
   opts.semDistrito: o mapa pinta todos os distritos */
function lugares(opts) {
  opts = opts || {};
  var s = selecao[atual.id], q = normalizar(filtro.busca);
  return EMPS.filter(function (e) {
    if (q && normalizar(e.busca + " " + e.nome_empreendimento).indexOf(q) < 0) { return false; }
    for (var i = 0; i < GRUPOS.length; i++) {
      var g = GRUPOS[i];
      if (g.k === opts.semGrupo) { continue; }
      if (opts.semDistrito && g.k === "distrito") { continue; }
      if (!passaGrupo(e, g, filtro[g.k])) { return false; }
    }
    if (s && !opts.semSel && chaveSel(s) !== opts.ignorar && !(opts.semDistrito && s.k === "distrito") && !passaSel(e, s)) { return false; }
    return true;
  });
}
function selecionar(s) {
  var a = selecao[atual.id];
  selecao[atual.id] = (a && JSON.stringify(a) === JSON.stringify(s)) ? null : s;
  esconderDica(); renderizar();
}
function selAtual(k) { var s = selecao[atual.id]; return s && chaveSel(s) === k ? s : null; }
function qtdFiltros() {
  return (filtro.busca ? 1 : 0) + GRUPOS.reduce(function (a, g) { return a + filtro[g.k].length; }, 0);
}

/* ==================================================================
   3. DOM, ícones e dica
   ================================================================== */
var NS = "http://www.w3.org/2000/svg";
function el(tag, cls, txt) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (txt != null) { n.textContent = txt; } return n; }
function sv(tag, a) { var n = document.createElementNS(NS, tag); for (var k in a) { n.setAttribute(k, a[k]); } return n; }
function icone(nome, duo) {
  var s = sv("svg", { "class": "i", viewBox: "0 0 256 256", "aria-hidden": "true", focusable: "false" });
  s.innerHTML = (ICONES[nome] || ICONES["info"])[duo ? 1 : 0];
  return s;
}
function botao(cls, filhos, rotuloAria) {
  var b = el("button", cls); b.type = "button";
  (filhos || []).forEach(function (f) { b.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
  if (rotuloAria) { b.setAttribute("aria-label", rotuloAria); }
  return b;
}
var dica = document.getElementById("dica");
function moverDica(ev) {
  var x = ev.clientX + 16, y = ev.clientY + 16, r = dica.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) { x = ev.clientX - r.width - 16; }
  if (y + r.height > innerHeight - 8) { y = ev.clientY - r.height - 16; }
  dica.style.left = Math.max(8, x) + "px"; dica.style.top = Math.max(8, y) + "px";
}
function esconderDica() { dica.classList.remove("on"); }
/* conteudo: [ {t: título pequeno}, [rótulo, valor], "texto", {h: dica de ação}, Node ] */
function ligarDica(no, conteudo) {
  function mostrar(ev) {
    dica.textContent = "";
    var itens = typeof conteudo === "function" ? conteudo() : conteudo;
    if (!itens.length) { esconderDica(); return; }
    itens.forEach(function (l) {
      var d;
      if (Array.isArray(l)) { d = el("div"); d.appendChild(el("span", "k", l[0] + ": ")); d.appendChild(el("b", null, l[1])); }
      else if (l && l.nodeType) { d = l; }
      else if (l && l.t) { d = el("div", "t", l.t); }
      else if (l && l.h) { d = el("div", "h", l.h); }
      else { d = el("div", null, l); }
      dica.appendChild(d);
    });
    dica.classList.add("on"); moverDica(ev);
  }
  no.addEventListener("mouseenter", mostrar);
  no.addEventListener("mousemove", moverDica);
  no.addEventListener("mouseleave", esconderDica);
  no.addEventListener("focus", function () { var r = no.getBoundingClientRect(); mostrar({ clientX: r.right, clientY: r.top }); });
  no.addEventListener("blur", esconderDica);
}
function dicaCat(titulo, cat, n, base, marcado) {
  return [{ t: titulo }, el("b", null, cat), [plural(n, "lugar", "lugares"), pct(n, base) + "% de " + base],
    { h: marcado ? "Clique para tirar a seleção" : "Clique para filtrar a página" }];
}

/* ==================================================================
   4. Cartão e visuais
   ================================================================== */
var conteudo = document.getElementById("conteudo");
var grade;
function cartao(pos, cfg) {
  cfg = cfg || {};
  var c = el("section", "cartao " + (cfg.cls || ""));
  c.style.gridColumn = pos[0] + " / span " + pos[1];
  c.style.gridRow = pos[2] + " / span " + (pos[3] || 1);
  if (cfg.altM) { c.style.setProperty("--alt-m", cfg.altM + "px"); }
  if (cfg.titulo) {
    var cab = el("div", "c-cab");
    if (cfg.icone) { var ic = el("div", "c-ico"); ic.appendChild(icone(cfg.icone, true)); cab.appendChild(ic); }
    var t = el("div", "c-tit"); t.appendChild(el("h2", null, cfg.titulo));
    if (cfg.sub) { t.appendChild(el("p", null, cfg.sub)); }
    cab.appendChild(t);
    var ac = el("div", "c-acoes"); cab.appendChild(ac); c._acoes = ac;
    c.appendChild(cab);
  }
  var corpo = el("div", "c-corpo"); c.appendChild(corpo); c._corpo = corpo;
  grade.appendChild(c);
  return c;
}
function nota(c, txt, ic) {
  var n = el("div", "c-nota"); if (ic) { n.appendChild(icone(ic)); } n.appendChild(document.createTextNode(txt)); c.appendChild(n);
}
function vazio(c) { c._corpo.appendChild(el("div", "vazio", "Nenhum lugar com os filtros atuais")); }
function contar(k, ids) {
  var ex = eixo(k), cont = {}, base = 0;
  ids.forEach(function (e) { var cs = ex.de(e); if (cs.length) { base++; } cs.forEach(function (v) { cont[v] = (cont[v] || 0) + 1; }); });
  return { base: base, linhas: ex.cats.filter(function (v) { return cont[v]; }).map(function (v) { return { cat: v, n: cont[v] }; }) };
}
function multipla(k) { return k === "seg" || k === "conv" || (k.indexOf("ind:") === 0 && INDS[k.slice(4)] && INDS[k.slice(4)].multipla_escolha === "True"); }

/* KPI: ícone, rótulo, valor e pé (barra Rural/Urbana ou barra de progresso) */
function kpi(pos, cfg) {
  var c = el("section", "cartao kpi");
  c.style.gridColumn = pos[0] + " / span " + pos[1]; c.style.gridRow = pos[2] + " / span 1";
  var ic = el("div", "k-ico" + (cfg.laranja ? " laranja" : "")); ic.appendChild(icone(cfg.icone, true)); c.appendChild(ic);
  var tx = el("div", "k-txt");
  tx.appendChild(el("div", "k-rot", cfg.rotulo));
  var v = el("div", "k-val", cfg.valor); if (String(cfg.valor).length > 10) { v.style.fontSize = "24px"; v.style.paddingTop = "4px"; } v.title = cfg.valor; if (cfg.unidade) { v.appendChild(el("small", null, cfg.unidade)); }
  tx.appendChild(v);
  var pe = el("div", "k-pe");
  if (cfg.zonas) {
    var tot = cfg.zonas[0] + cfg.zonas[1], barra = el("div", "k-barra"), s = selAtual("zona");
    [["Rural", cfg.zonas[0], "var(--verde)"], ["Urbana", cfg.zonas[1], "var(--urbana)"]].forEach(function (z) {
      if (!z[1]) { return; }
      var b = botao(s && s.v !== z[0] ? "apagado" : "", [], z[0] + ": " + fmt(z[1]));
      b.style.flex = z[1] + " 0 0"; b.style.background = z[2];
      b.addEventListener("click", function () { selecionar({ k: "zona", v: z[0] }); });
      ligarDica(b, [{ t: cfg.rotulo }, el("b", null, z[0]), ["Valor", fmt(z[1])], ["Participação", pct(z[1], tot) + "%"], { h: "Clique para filtrar a página" }]);
      barra.appendChild(b);
    });
    pe.appendChild(barra);
    var sub = el("div", "k-sub");
    [["Rural", cfg.zonas[0], "var(--verde)"], ["Urbana", cfg.zonas[1], "var(--urbana)"]].forEach(function (z) {
      var sp = el("span"); var i = el("i"); i.style.background = z[2]; sp.appendChild(i);
      sp.appendChild(document.createTextNode(z[0] + " " + fmt(z[1]) + (tot ? " (" + pct(z[1], tot) + "%)" : "")));
      sub.appendChild(sp);
    });
    pe.appendChild(sub);
  } else if (cfg.prog != null) {
    var bp = el("div", "k-barra"), f = el("span"); f.style.cssText = "width:" + cfg.prog + "%;background:var(--verde);border-radius:3px";
    bp.appendChild(f); pe.appendChild(bp);
    pe.appendChild(el("div", "k-sub", cfg.sub || ""));
  } else if (cfg.sub) {
    pe.appendChild(el("div", "k-sub", cfg.sub));
  }
  tx.appendChild(pe); c.appendChild(tx);
  if (cfg.dica) { ligarDica(c, cfg.dica); }
  grade.appendChild(c);
}
function porZona(ids, f) {
  var r = 0, u = 0; f = f || function () { return 1; };
  ids.forEach(function (e) { var x = f(e); if (zona(e) === "Rural") { r += x; } else if (zona(e) === "Urbana") { u += x; } });
  return [r, u];
}
function kpiPct(pos, rot, ic, ids, teste, base, extra) {
  var b = ids.filter(base || function () { return true; }), n = b.filter(teste).length;
  kpi(pos, Object.assign({ rotulo: rot, icone: ic, valor: b.length ? pct(n, b.length) + "%" : "–", prog: pct(n, b.length),
    sub: b.length ? plural(n, "lugar", "lugares") + " de " + b.length : "sem lugares com os filtros" }, extra || {}));
}
function tem(ind, v) { return function (e) { var c = catsDe(ind, e); return Array.isArray(v) ? v.some(function (x) { return c.indexOf(x) >= 0; }) : c.indexOf(v) >= 0; }; }
function respondeu(ind) { return function (e) { return catsDe(ind, e).length > 0; }; }

/* barras horizontais */
function barras(pos, k, cfg) {
  var c = cartao(pos, cfg);
  var r = contar(k, lugares({ ignorar: k })), s = selAtual(k);
  if (cfg.ordenar) { r.linhas.sort(function (a, b) { return b.n - a.n; }); }
  var total = r.linhas.length;
  if (cfg.top && r.linhas.length > cfg.top) { r.linhas = r.linhas.slice().sort(function (a, b) { return b.n - a.n; }).slice(0, cfg.top); }
  if (!r.linhas.length) { vazio(c); return c; }
  var max = Math.max.apply(null, r.linhas.map(function (l) { return l.n; }));
  var hb = el("div", "hb"); hb.style.setProperty("--rot", cfg.rot || "34%");
  if (r.linhas.length <= 4) { hb.style.justifyContent = "center"; hb.style.gap = "16px"; }
  hb.style.setProperty("--alt", (cfg.alt || (r.linhas.length > 9 ? 12 : r.linhas.length > 6 ? 15 : 18)) + "px");
  r.linhas.forEach(function (l) {
    var marcado = s && s.v === l.cat;
    var b = botao("hb-l" + (s && !marcado ? " apagado" : ""), [], rotulo(k, l.cat) + ": " + l.n);
    b.setAttribute("aria-pressed", marcado ? "true" : "false");
    b.appendChild(el("span", "hb-r", rotulo(k, l.cat)));
    var t = el("span", "hb-t"), w = Math.max(1.5, 100 * l.n / max * 0.8);
    var bb = el("span", "hb-b"); bb.style.width = w + "%"; if (cfg.cor) { bb.style.background = cfg.cor; }
    var vl = el("span", "hb-v" + (w > 64 ? " dentro" : "")); vl.style.setProperty("--w", w + "%");
    vl.appendChild(document.createTextNode(fmt(l.n))); vl.appendChild(el("small", null, pct(l.n, r.base) + "%"));
    t.appendChild(bb); t.appendChild(vl); b.appendChild(t);
    b.addEventListener("click", function () { selecionar({ k: k, v: l.cat }); });
    ligarDica(b, dicaCat(cfg.titulo, rotulo(k, l.cat), l.n, r.base, marcado));
    hb.appendChild(b);
  });
  c._corpo.appendChild(hb);
  nota(c, (cfg.top && total > cfg.top ? "Os " + cfg.top + " mais citados de " + total + " · " : "") + (multipla(k) ? "Mais de uma resposta por lugar · " : "") + "base: " + plural(r.base, "lugar", "lugares"), "info");
  return c;
}

/* colunas */
function colunas(pos, k, cfg) {
  var c = cartao(pos, cfg);
  var r = contar(k, lugares({ ignorar: k })), s = selAtual(k);
  if (cfg.fora) { r.linhas = r.linhas.filter(function (l) { return cfg.fora.indexOf(l.cat) < 0; }); }
  if (!r.linhas.length) { vazio(c); return c; }
  var max = Math.max.apply(null, r.linhas.map(function (l) { return l.n; }));
  var cb = el("div", "cb"), area = el("div", "cb-area"), rots = el("div", "cb-rots");
  [25, 50, 75].forEach(function (p) { var g = el("div", "cb-grade"); g.style.bottom = (p * 0.86) + "%"; area.appendChild(g); });
  r.linhas.forEach(function (l) {
    var marcado = s && s.v === l.cat;
    var b = botao("cb-c" + (s && !marcado ? " apagado" : ""), [], rotulo(k, l.cat) + ": " + l.n);
    b.appendChild(el("span", "cb-v", fmt(l.n)));
    var bb = el("span", "cb-b"); bb.style.height = Math.max(1, 86 * l.n / max) + "%"; b.appendChild(bb);
    b.addEventListener("click", function () { selecionar({ k: k, v: l.cat }); });
    ligarDica(b, dicaCat(cfg.titulo, rotulo(k, l.cat), l.n, r.base, marcado));
    area.appendChild(b);
    rots.appendChild(el("span", "cb-r", cfg.curto ? curto(k, l.cat) : rotulo(k, l.cat)));
  });
  cb.appendChild(area); cb.appendChild(rots); c._corpo.appendChild(cb);
  nota(c, (multipla(k) ? "Mais de uma resposta por lugar · " : "") + "base: " + plural(r.base, "lugar", "lugares") + (cfg.notaExtra ? " · " + cfg.notaExtra : ""), "info");
  return c;
}

/* proporções: várias perguntas, cada uma numa barra de 100% */
var COR_CAT = {

  "Não": "var(--nao)", "Não se aplica": "var(--neutro)", "Outras respostas": "var(--neutro)", "Não informou": "var(--neutro)",
  "Presencial": "var(--verde)", "Presencial e delivery": "var(--verde-claro)", "Delivery": "var(--urbana)",

    var box = el("div", g.tipo === "segmentado" ? "seg-ctl" : g.tipo === "chips" ? "g-chips" : "opcoes");

  var pe = el("div", "g-pe");
  var b1 = botao("sec", ["Limpar tudo"]); b1.addEventListener("click", limparFiltros);
  var b2 = botao("pri", ["Ver resultado"]); b2.id = "g-ver"; b2.addEventListener("click", fecharGaveta);
  pe.appendChild(b1); pe.appendChild(b2); gaveta.appendChild(pe);
  atualizarGaveta();
}
function atualizarGaveta() {
  var total = lugares({ semSel: true }).length;
  var res = document.getElementById("g-res"); if (!res) { return; }
  res.textContent = ""; res.appendChild(el("b", null, fmt(total))); res.appendChild(document.createTextNode(" de " + EMPS.length + " lugares atendem aos filtros"));
  document.getElementById("g-ver").textContent = "Ver " + plural(total, "lugar", "lugares");
  GRUPOS.forEach(function (g) {
    var box = gaveta.querySelector('[data-grupo="' + g.k + '"][role="group"]'); if (!box) { return; }
    var ids = lugares({ semGrupo: g.k, semSel: true }), ex = eixo(g.k);
    box.querySelectorAll("button").forEach(function (b) {
      var v = b.dataset.v, marcado = v ? filtro[g.k].indexOf(v) >= 0 : !filtro[g.k].length;
      if (g.tipo === "lista") {
        b.setAttribute("aria-checked", marcado ? "true" : "false");
        var n = ids.filter(function (e) { return ex.de(e).indexOf(v) >= 0; }).length;
        b.querySelector(".n").textContent = fmt(n); b.classList.toggle("zero", !n && !marcado);
      } else { b.setAttribute("aria-pressed", marcado ? "true" : "false"); }
    });
    var lim = gaveta.querySelector('.g-sec-cab button[data-grupo="' + g.k + '"]');
    if (lim) { lim.style.visibility = filtro[g.k].length ? "visible" : "hidden"; }
  });
}
function abrirGaveta() {
  gaveta.classList.add("aberta"); gaveta.setAttribute("aria-hidden", "false"); veu.classList.add("on"); esconderDica();
  setTimeout(function () { var i = document.getElementById("g-busca"); if (i) { i.focus(); } }, 120);
}
function fecharGaveta() { gaveta.classList.remove("aberta"); gaveta.setAttribute("aria-hidden", "true"); veu.classList.remove("on"); faixa.classList.remove("larga"); }
function limparFiltros() {
  filtro = { busca: "", seg: [], distrito: [], zona: [], conv: [], "ind:via": [], "ind:recursos_acess": [] }; selecao = {};
  var i = document.getElementById("g-busca"); if (i) { i.value = ""; }
  aposFiltro();
}
veu.addEventListener("click", fecharGaveta);
var _timer = null;
function aposFiltro() {
  atualizarGaveta();
  clearTimeout(_timer);
  _timer = setTimeout(renderizar, 60);   /* agrupa cliques rápidos */
}

function renderizar() {
  esconderDica(); descartarMapas();
  var rol = conteudo.scrollTop;
  conteudo.textContent = "";
  grade = el("div", "grade");
  grade.style.gridTemplateRows = atual.linhas || LINHAS_PADRAO;
  conteudo.appendChild(grade);
  atual.fn();
  montarCabecalho();
  atualizarGaveta();
  conteudo.scrollTop = rol;
}
function ir(id) {
  if (!PAG[id]) { id = "visao"; }
  if (location.hash.slice(1) !== id) { history.pushState(null, "", "#" + id); }
  atual = PAG[id];
  document.title = atual.nome + " · Diagnóstico Turístico · Montanhas Capixabas";
  montarFaixa(); renderizar();
  if (document.body.classList.contains("compacto")) { window.scrollTo(0, 0); }
}
window.addEventListener("popstate", function () { atual = PAG[location.hash.slice(1)] || PAGINAS[1]; montarFaixa(); renderizar(); });
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") { fecharGaveta(); recolherFaixa(); veu.classList.remove("on"); }
  var tg = ev.target.tagName;
  if (tg === "INPUT" || tg === "SELECT" || tg === "TEXTAREA") { return; }
  if (ev.key === "PageDown") { ev.preventDefault(); ir(PAGINAS[(atual.n + 1) % PAGINAS.length].id); }
  if (ev.key === "PageUp") { ev.preventDefault(); ir(PAGINAS[(atual.n - 1 + PAGINAS.length) % PAGINAS.length].id); }
});

var palco = document.getElementById("palco"), mold = document.getElementById("moldura"), _compacto = null;
function ajustar() {
  var compacto = innerWidth < 900 || innerHeight < 420;
  document.body.classList.toggle("compacto", compacto);
  if (!compacto) {
    var w = mold.clientWidth, h = mold.clientHeight, e = Math.min(w / 1600, h / 900);
    palco.style.transform = "scale(" + e + ")";
    palco.style.left = Math.max(0, (w - 1600 * e) / 2) + "px";
    palco.style.top = Math.max(0, (h - 900 * e) / 2) + "px";
  } else { palco.style.transform = ""; palco.style.left = ""; palco.style.top = ""; }
  if (_compacto !== null && _compacto !== compacto) { renderizar(); }
  _compacto = compacto;
}
window.addEventListener("resize", ajustar);
ajustar();
atual = PAG[location.hash.slice(1)] || PAGINAS[1];
document.title = atual.nome + " · Diagnóstico Turístico · Montanhas Capixabas";
montarFaixa(); montarGaveta(); renderizar();
</script>
