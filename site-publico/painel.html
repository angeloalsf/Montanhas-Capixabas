<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turismo em Dados · Montanhas Capixabas</title>
<meta name="description" content="Painel do diagnóstico da oferta turística de Alfredo Chaves (ES), no formato de relatório do Power BI.">
<!--
  painel.html — "Turismo em Dados", painel do diagnóstico turístico de Alfredo Chaves.

  Layout reproduzido do relatório público do Power BI "Viva Guarapari: Turismo em dados"
  (capa com atalhos, menu lateral de páginas, painel de filtros que desliza, ajuda com
  legendas, cartões com cantos arredondados sobre canvas cinza, mapa por página).
  Os DADOS são todos do projeto Montanhas Capixabas: os blocos <script type="text/plain">
  abaixo são copiados do index.html pelo gerar_painel.py. Nada aqui é digitado à mão.

  Diferenças necessárias em relação ao original:
  - Sem mapa de pontos: nenhum lugar tem coordenada (o formulário guardou só o endereço).
    O mapa de cada página é a carta dos 7 distritos (bloco geo-distritos, OSM/IBGE),
    pintada pela quantidade de lugares. Clicar num distrito filtra o painel.
  - Sem "média de ocupação": o formulário não perguntou. No lugar entram indicadores que
    existem nos dados (pet, espaço infantil, feriados...).
  - "Parceiros/Contato" virou "Contatos": a lista de contatos que os estabelecimentos
    autorizaram publicar. Logos de parceiros entram pela constante PARCEIROS (vazia hoje).

  Funciona aberto do disco (duplo clique) e no GitHub Pages; não faz pedido de rede.
  Atualizar os dados:  python site-publico/gerar_site.py  e depois
                       python site-publico/gerar_painel.py
-->
<style>
@font-face {
  font-family: "Instrument Sans";
  src: url("assets/fontes/instrument-sans.woff2") format("woff2");
  font-weight: 400 700;
  font-display: swap;
}

:root {
  /* paleta do relatório de referência */
  --indigo: #28156D;
  --indigo-2: #3B2A85;
  --vermelho: #CF251C;
  --canvas: #CCCCCC;
  --painel: #F4F4F4;
  --lateral: #F2F2F2;
  --borda: #D6D6D6;
  --texto: #28156D;
  --texto-2: #555555;
  --texto-3: #6B6B6B;
  --fundo: #FFFFFF;
  --barra: #F3F3F3;
  /* escala sequencial do mapa: um matiz, claro → escuro */
  --seq-0: #E7E7E7;
  --seq-1: #DAD5EE;
  --seq-2: #B3A8DA;
  --seq-3: #8676C0;
  --seq-4: #5643A0;
  --seq-5: #28156D;
  --fonte: "Instrument Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
/* O relatório de referência não tem tema escuro: o canvas é sempre o cinza do Power BI.
   Só o entorno da página acompanha o sistema. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --fundo: #1E1E1E; --barra: #2A2A2A; }
}
:root[data-theme="dark"] { --fundo: #1E1E1E; --barra: #2A2A2A; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fundo);
  font-family: var(--fonte);
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--vermelho); outline-offset: 2px; }

/* ---------- moldura: o canvas de 1920x1080 escalado para caber, como no Power BI ---------- */
#app { display: flex; flex-direction: column; height: 100%; }
.moldura { flex: 1; position: relative; overflow: hidden; }
.palco {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  background: var(--canvas);
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.08);
}
.barra-pbi {
  height: 44px; flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 16px;
  background: var(--barra);
  border-top: 1px solid rgba(127,127,127,.25);
  font-size: 14px; color: #3c3c3c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .barra-pbi { color: #ddd; } }
.barra-pbi .marca { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navpag { display: flex; align-items: center; gap: 6px; }
.navpag span { min-width: 190px; text-align: center; font-weight: 600; }
.btn-ico {
  width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent;
  display: inline-grid; place-items: center; cursor: pointer;
}
.btn-ico:hover { background: rgba(127,127,127,.18); }
.btn-ico svg { width: 18px; height: 18px; }

/* ---------- ícones ---------- */
svg.ico { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- capa ---------- */
.capa-topo {
  height: 160px; background: var(--indigo); color: #fff;
  border-bottom: 12px solid var(--vermelho);
  display: grid; grid-template-columns: 300px 1fr 300px; align-items: center; padding: 0 60px;
}
.selo {
  width: 160px; height: 112px; border-radius: 12px; background: #F4F4F4;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--indigo); box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.selo svg { width: 92px; height: 46px; }
.selo b { font-size: 17px; line-height: 1.05; text-align: center; }
.capa-topo h1 { margin: 0; text-align: center; font-size: 76px; font-weight: 700; letter-spacing: -.5px; }
.capa-dev { text-align: right; font-size: 17px; line-height: 1.35; }
.capa-dev b { display: block; font-size: 18px; }
.capa-corpo { position: absolute; top: 172px; left: 0; right: 0; bottom: 175px; display: flex; flex-direction: column; align-items: center; }
.capa-corpo h2 { margin: 40px 0 6px; font-size: 118px; font-weight: 700; color: var(--vermelho); letter-spacing: -1px; line-height: 1; }
.capa-corpo p.sub { margin: 0 0 38px; font-size: 32px; color: var(--indigo); font-weight: 600; }
.atalhos { display: grid; grid-template-columns: repeat(4, 320px); gap: 36px 60px; }
.atalho {
  height: 200px; border: 0; border-radius: 16px; background: #EDEDED; cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,.28);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  color: var(--indigo); font-size: 25px; font-weight: 700; line-height: 1.15; text-align: center;
  transition: transform .15s, box-shadow .15s;
}
.atalho:hover { transform: translateY(-4px); box-shadow: 0 10px 18px rgba(0,0,0,.3); }
.atalho svg { width: 74px; height: 74px; stroke-width: 2.4; }
.capa-rodape {
  position: absolute; left: 0; right: 0; bottom: 0; height: 175px;
  background: #DCDCDC; border-top: 2px solid #BDBDBD;
  display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 60px; padding: 30px 110px;
}
.capa-rodape h3 { margin: 0 0 10px; font-size: 18px; color: var(--indigo); }
.capa-rodape p { margin: 0; font-size: 22px; color: #333; line-height: 1.35; }

/* ---------- páginas internas ---------- */
.topo {
  height: 150px; background: var(--indigo); color: #fff;
  border-bottom: 10px solid var(--vermelho);
  display: flex; align-items: center; justify-content: center;
  font-size: 62px; font-weight: 700; letter-spacing: -.3px;
}
.topo h1 { margin: 0; font: inherit; }
.lateral {
  position: absolute; left: 0; top: 150px; bottom: 0; width: 178px;
  background: var(--lateral); box-shadow: 2px 0 6px rgba(0,0,0,.18);
  display: flex; flex-direction: column; padding-top: 10px; z-index: 5;
}
.lat-sec { font-size: 14px; font-weight: 700; color: var(--indigo); padding: 14px 14px 4px; }
.lat-item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px;
  padding: 6px 14px; border: 0; background: transparent; cursor: pointer; text-align: left;
  font-size: 15.5px; font-weight: 600; color: var(--indigo); line-height: 1.1;
}
.lat-item:hover { background: #E2E2E2; }
.lat-item.ativo { background: var(--vermelho); color: #fff; }
.lat-item svg { width: 22px; height: 22px; flex: none; }
.lat-item .qtd {
  margin-left: auto; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
  background: var(--vermelho); color: #fff; font-size: 13px; display: none; place-items: center;
}
.lat-item .qtd.on { display: inline-grid; }
.lat-pe { margin-top: auto; padding: 16px 10px 22px; text-align: center; font-size: 12.5px; color: var(--indigo); line-height: 1.3; }
.lat-pe b { display: block; font-size: 13.5px; }

.conteudo { position: absolute; left: 210px; right: 22px; top: 186px; bottom: 30px; }
.painel {
  background: var(--painel); border-radius: 18px;
  box-shadow: 0 3px 9px rgba(0,0,0,.26);
  padding: 18px 26px; min-height: 0; min-width: 0;
  display: flex; flex-direction: column;
}
.p-titulo { margin: 0 0 6px; color: var(--vermelho); font-weight: 700; font-size: 25px; text-align: center; }
.p-nota { margin: 0; text-align: center; font-size: 15px; color: var(--texto-3); }

.g-seg {
  height: 100%; display: grid; gap: 30px;
  grid-template-columns: 430px 430px 1fr;
  grid-template-rows: 252px 280px 1fr;
}
.g-seg .mapa-p { grid-column: 3; grid-row: 1 / 4; }
.g-seg .barra-p { grid-column: 1 / 3; }

/* KPI */
.kpi { display: grid; flex: 1; align-items: center; }
.kpi.duplo { grid-template-columns: 1fr 1fr; }
.kpi-parte { text-align: center; padding: 0 8px; }
.kpi.duplo .kpi-parte + .kpi-parte { border-left: 2px solid var(--borda); }
.kpi-valor { font-size: 66px; font-weight: 600; color: var(--indigo); line-height: 1.05; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.kpi.duplo .kpi-valor { font-size: 56px; }
.kpi-rot { font-size: 19px; color: var(--texto-3); margin-top: 6px; line-height: 1.2; }
.kpi.duplo .kpi-rot { min-height: 2.4em; }
.kpi-base { font-size: 14px; color: var(--texto-3); text-align: center; }

/* barras horizontais */
.hbar { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 7px; min-height: 0; }
.hb-linha {
  display: grid; grid-template-columns: minmax(0, var(--rot, 34%)) 1fr; align-items: center; gap: 12px;
  border: 0; background: none; padding: 0; cursor: pointer; text-align: left; width: 100%;
}
.hb-rot { font-size: 18px; color: var(--texto-2); text-align: right; line-height: 1.08; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.hb-trilho { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hb-barra { height: 24px; background: var(--indigo); border-radius: 0 4px 4px 0; min-width: 3px; transition: width .35s, opacity .2s; }
.hb-val { font-size: 16px; color: var(--texto-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb-linha:hover .hb-barra, .cb-col:hover .cb-barra { background: var(--indigo-2); }
.apagado .hb-barra, .apagado .cb-barra { opacity: .28; }

/* colunas */
.cbar { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 22px; min-height: 0; padding-top: 6px; }
.cb-col {
  flex: 0 1 96px; height: 100%; display: flex; flex-direction: column; align-items: stretch;
  border: 0; background: none; padding: 0; cursor: pointer; min-width: 0;
}
.cb-area { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.cb-val { font-size: 16px; color: var(--texto-2); margin-bottom: 4px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cb-barra { width: 100%; background: var(--indigo); border-radius: 4px 4px 0 0; min-height: 3px; transition: height .35s, opacity .2s; }
.cb-rot {
  overflow-wrap: anywhere;
  margin-top: 6px; border-top: 1px solid #BDBDBD; padding-top: 5px; width: 100%;
  font-size: 16px; color: var(--texto-2); line-height: 1.12; text-align: center; height: 42px; overflow: hidden;
}
.vazio { flex: 1; display: grid; place-items: center; font-size: 19px; color: var(--texto-3); text-align: center; }

/* mapa */
.m-titulo { margin: 4px 0 8px; text-align: center; font-size: 44px; font-weight: 700; color: var(--indigo); letter-spacing: -.5px; }
.m-area { flex: 1; min-height: 0; position: relative; border-radius: 10px; background: #F1EEE6; overflow: hidden; }
.m-area svg { width: 100%; height: 100%; display: block; }
.d-forma { stroke: #fff; stroke-width: 2.2; cursor: pointer; transition: opacity .2s, fill .3s; }
.d-forma:hover { stroke: var(--vermelho); stroke-width: 3.5; }
.d-forma.sel { stroke: var(--vermelho); stroke-width: 5; }
.d-forma.fora { opacity: .4; }
.d-nome { font-size: 25px; font-weight: 700; fill: var(--indigo); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
.d-num { font-size: 22px; font-weight: 600; fill: var(--indigo); paint-order: stroke; stroke: #fff; stroke-width: 5px; pointer-events: none; }
.m-legenda { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; font-size: 16px; color: var(--texto-2); flex-wrap: wrap; }
.m-legenda i { width: 30px; height: 16px; display: inline-block; border-radius: 2px; }
.m-legenda .dica-m { margin-left: 18px; color: var(--texto-3); }
.m-zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.m-zoom button { width: 34px; height: 34px; border: 1px solid #ccc; background: #fff; border-radius: 6px; font-size: 22px; line-height: 1; cursor: pointer; color: #333; }

/* contexto */
.g-ctx { height: 100%; display: grid; grid-template-rows: 1fr 200px; gap: 30px; }
.ctx-p { padding: 28px 60px; }
.ctx-p h2 { margin: 0; text-align: center; font-size: 62px; font-weight: 700; text-transform: uppercase; color: var(--indigo); letter-spacing: -.5px; }
.ctx-p .ctx-sub { margin: 2px 0 22px; text-align: center; font-size: 34px; color: var(--vermelho); }
.ctx-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; }
.ctx-cols h3 { margin: 0 0 12px; font-size: 30px; font-weight: 700; text-transform: uppercase; color: var(--indigo); }
.ctx-cols ul { margin: 0; padding-left: 30px; }
.ctx-cols li { font-size: 25px; line-height: 1.28; margin-bottom: 6px; color: var(--indigo); }
.ctx-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }

/* mapa geral */
.g-mapa { height: 100%; display: grid; grid-template-columns: 1fr 560px; gap: 30px; }
.lista { flex: 1; overflow-y: auto; min-height: 0; margin: 4px -10px 0 0; padding-right: 10px; }
.lugar { padding: 13px 4px; border-bottom: 1px solid var(--borda); }
.lugar:last-child { border-bottom: 0; }
.lugar b { display: block; font-size: 20px; color: var(--indigo); }
.lugar .cat { font-size: 15px; color: var(--vermelho); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
.lugar p { margin: 3px 0 0; font-size: 16px; color: var(--texto-2); line-height: 1.3; }

/* contatos */
.g-cont { height: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 200px 1fr; gap: 30px; }
.g-cont .tab-p { grid-column: 1 / 4; }
.proj { justify-content: center; gap: 10px; }
.proj h3 { margin: 0; color: var(--indigo); font-size: 26px; }
.proj p { margin: 0; font-size: 19px; color: var(--texto-2); line-height: 1.35; }
.busca { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.busca input {
  flex: 1; height: 44px; font: inherit; font-size: 18px; padding: 0 14px; color: #222;
  border: 1px solid #BDBDBD; border-radius: 8px; background: #fff;
}
.busca span { font-size: 17px; color: var(--texto-3); white-space: nowrap; }
.tabela { flex: 1; overflow: auto; min-height: 0; border-radius: 8px; background: #fff; border: 1px solid var(--borda); }
table { border-collapse: collapse; width: 100%; font-size: 17px; }
th { position: sticky; top: 0; background: var(--indigo); color: #fff; text-align: left; font-weight: 600; padding: 10px 12px; z-index: 1; }
td { padding: 9px 12px; border-bottom: 1px solid #E6E6E6; color: #333; vertical-align: top; }
tr:nth-child(even) td { background: #FAFAFA; }
td a { color: var(--indigo); font-weight: 600; }
.parceiros { display: flex; flex-wrap: wrap; gap: 30px; align-items: center; justify-content: center; flex: 1; }
.parceiros img { max-height: 70px; max-width: 220px; }

/* painel de filtros (desliza sobre o conteúdo, como o "Grupo 4" do original) */
.filtros {
  position: absolute; left: 198px; top: 178px; width: 300px; height: 660px; z-index: 20;
  background: #fff; border: 2px solid var(--vermelho); border-radius: 4px;
  box-shadow: 6px 6px 18px rgba(0,0,0,.25);
  padding: 14px 20px; display: flex; flex-direction: column;
  transform: translateX(-130%); opacity: 0; visibility: hidden;
  transition: transform .25s ease, opacity .25s, visibility .25s;
}
.filtros.aberto { transform: none; opacity: 1; visibility: visible; }
.filtros h2 { margin: 0 0 12px; font-size: 27px; font-weight: 500; text-align: center; color: #222; border-bottom: 2px solid #222; padding-bottom: 4px; }
.slicer { margin-bottom: 14px; }
.slicer label { display: block; font-size: 15px; color: #333; margin-bottom: 4px; }
.slicer select {
  width: 100%; height: 38px; font: inherit; font-size: 16px; color: #222;
  border: 0; border-bottom: 1px solid #999; background: #fff; padding: 0 4px; cursor: pointer;
}
.f-acoes { margin-top: auto; display: flex; justify-content: center; gap: 18px; }
.f-acoes button {
  height: 40px; padding: 0 14px; border-radius: 20px; border: 2px solid var(--indigo);
  background: #fff; color: var(--indigo); font-size: 15px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.f-acoes button svg { width: 18px; height: 18px; }

/* ajuda: legendas ao lado do menu */
.ajuda { position: absolute; inset: 150px 0 0 0; z-index: 30; background: rgba(40,40,40,.32); display: none; cursor: pointer; }
.ajuda.aberto { display: block; }
.ajuda .rot {
  position: absolute; left: 188px; transform: translateY(-50%);
  background: #fff; border: 2px solid var(--vermelho); padding: 6px 12px; font-size: 15px; color: #222;
  max-width: 300px; line-height: 1.2;
}
.ajuda .rot::before { content: ""; position: absolute; left: -12px; top: 50%; width: 12px; height: 2px; background: var(--vermelho); }

/* dica (tooltip) — fica fora do palco para não escalar */
.dica {
  position: fixed; z-index: 100; pointer-events: none; max-width: 300px;
  background: #fff; color: #222; border: 1px solid #C8C8C8; border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,.2); padding: 10px 12px; font-size: 13.5px; line-height: 1.35;
  opacity: 0; transition: opacity .12s;
}
.dica.on { opacity: 1; }
.dica b { color: var(--indigo); display: block; font-size: 14.5px; }
.dica .t { color: var(--vermelho); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
.dica ul { margin: 4px 0 0; padding-left: 16px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- celular: sem escala, tudo empilhado ---------- */
body.compacto { overflow: auto; }
body.compacto #app { height: auto; min-height: 100%; }
body.compacto .moldura { overflow: visible; }
body.compacto .palco { position: relative; width: 100%; height: auto; transform: none !important; min-height: calc(100vh - 44px); padding-bottom: 20px; }
body.compacto .barra-pbi { position: sticky; bottom: 0; z-index: 40; }
body.compacto .barra-pbi .marca { display: none; }
body.compacto .navpag span { min-width: 0; font-size: 13px; }
body.compacto .capa-topo { height: auto; grid-template-columns: 1fr; padding: 16px; gap: 10px; justify-items: center; border-bottom-width: 6px; }
body.compacto .capa-topo h1 { font-size: 30px; }
body.compacto .selo { width: 120px; height: 84px; }
body.compacto .selo svg { width: 64px; height: 32px; }
body.compacto .selo b { font-size: 13px; }
body.compacto .capa-dev { text-align: center; font-size: 13px; }
body.compacto .capa-dev b { font-size: 14px; }
body.compacto .capa-corpo, body.compacto .capa-rodape { position: static; height: auto; }
body.compacto .capa-corpo { padding: 0 16px 24px; }
body.compacto .capa-corpo h2 { font-size: 44px; margin-top: 26px; text-align: center; }
body.compacto .capa-corpo p.sub { font-size: 16px; margin-bottom: 22px; text-align: center; }
body.compacto .atalhos { grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 480px; }
body.compacto .atalho { height: 120px; font-size: 15px; gap: 10px; border-radius: 12px; }
body.compacto .atalho svg { width: 40px; height: 40px; }
body.compacto .capa-rodape { grid-template-columns: 1fr; gap: 12px; padding: 18px 16px; }
body.compacto .capa-rodape h3 { font-size: 13px; margin-bottom: 2px; }

<script>

function parseCSV(texto) {
  var txt = (texto || "").replace(/^﻿/, "").replace(/\r\n?/g, "\n").trim();
  if (!txt) { return []; }
  var linhas = [], linha = [], campo = "", dentro = false, i, c;
  for (i = 0; i < txt.length; i++) {
    c = txt.charAt(i);
    if (dentro) {
      if (c === '"') { if (txt.charAt(i + 1) === '"') { campo += '"'; i++; } else { dentro = false; } }
      else { campo += c; }
    } else if (c === '"') { dentro = true; }
    else if (c === ";") { linha.push(campo); campo = ""; }
    else if (c === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else { campo += c; }
  }
  linha.push(campo); linhas.push(linha);
  var cab = linhas.shift().map(function (n) { return n.replace(/^﻿/, "").trim(); });
  return linhas.filter(function (l) { return l.length > 1 || l[0] !== ""; }).map(function (l) {
    var o = {};
    for (var j = 0; j < cab.length; j++) { o[cab[j]] = (l[j] === undefined ? "" : l[j]).trim(); }
    return o;
  });
}
function bloco(id) { var el = document.getElementById(id); return el ? el.textContent.trim() : ""; }
function tabela(nome) { return parseCSV(bloco("csv-" + nome)); }
function num(v) { var n = parseFloat(String(v || "").replace(",", ".")); return isNaN(n) ? 0 : n; }

/* Agrupamentos SÓ de apresentação, para as colunas ficarem legíveis como no original
   (Sim/Não, Gratuito/Pago...). Não mudam nenhuma contagem: um lugar cai num grupo
   exatamente quando cai numa das categorias de origem. */
var AGRUPAR = {
  idioma: function (c) { return c === "Não atende" ? "Não" : "Sim"; },
  estacionamento: function (c) {
    if (/^Gratuito/.test(c)) { return "Gratuito"; }
    if (/^Pago/.test(c)) { return "Pago"; }
    if (c === "Estacionamento na rua") { return "Na rua"; }
    return "Não possui";
  }
};

  var ind = f.id_indicador, g = AGRUPAR[ind] ? AGRUPAR[ind](f.categoria) : f.categoria;

  var lista = porId[f.id_empreendimento] = porId[f.id_empreendimento] || [];
  if (lista.indexOf(g) < 0) { lista.push(g); }
  var ord = ORDEM_CAT[ind] = ORDEM_CAT[ind] || {};
  var o = num(f.ordem_categoria);
  if (!(g in ord) || o < ord[g]) { ord[g] = o; }

function decodificarPolilinha(s) {
  var i = 0, lat = 0, lng = 0, pts = [];
  while (i < s.length) {
    for (var k = 0; k < 2; k++) {
      var desloc = 0, res = 0, b;
      do { b = s.charCodeAt(i++) - 63; res |= (b & 0x1f) << desloc; desloc += 5; } while (b >= 0x20);
      var d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (k === 0) { lat += d; } else { lng += d; }
    }
    pts.push([lat / 1e4, lng / 1e4]);
  }
  return pts;
}

    dOrd[0] + " e " + dOrd[1] + " concentram " + pct(porD[dOrd[0]] + porD[dOrd[1]], TOTAL) + "% dos lugares.",
    pct(rural, TOTAL) + "% dos lugares ficam na zona rural.",
    nSeg("Alimentação") + " lugares para comer e " + nSeg("Hospedagem") + " para se hospedar.",
    nSeg("Agroindústria") + " agroindústrias e " + nSeg("Recursos Naturais") + " atrativos naturais.",
    fmt(capH) + " vagas de hospedagem declaradas.",
    pct(fds, TOTAL) + "% abrem no fim de semana e " + fer.v + " em feriados."
  ];
  var dir = [
    "Levantamento do projeto Montanhas Capixabas.",
    "Pesquisa de campo de outubro de 2025 a agosto de 2026.",
    "Formulário respondido pelos próprios estabelecimentos.",
    "Base de " + TOTAL + " lugares, a mesma do relatório de estatística descritiva.",
    "Endereço, horário e contato publicados com autorização.",
    "Resultou no Diagnóstico da oferta turística de Alfredo Chaves."
  ];
  [["Contexto geral da oferta", esq], ["Dados do projeto", dir]].forEach(function (col) {
    var d = el("div"); d.appendChild(el("h3", null, col[0]));
    var ul = el("ul"); col[1].forEach(function (t) { ul.appendChild(el("li", null, t)); });
    d.appendChild(ul); cols.appendChild(d);
  });
  p.appendChild(cols);
  g.appendChild(p);

  var ks = el("div", "ctx-kpis");
  [["Lugares Mapeados", fmt(TOTAL), "empreendimentos"],
   ["Distritos", fmt(REGS.length), "com oferta turística"],
   ["Zona Rural", pct(rural, TOTAL) + "%", "dos lugares"],
   ["Feriados", fer.v, "abrem em feriados"]].forEach(function (k) {
    var q = painel("", k[0]);
    var kk = el("div", "kpi"); var d = el("div", "kpi-parte");
    d.appendChild(el("div", "kpi-valor", k[1])); d.appendChild(el("div", "kpi-rot", k[2]));
    kk.appendChild(d); q.appendChild(kk); ks.appendChild(q);
  });
  g.appendChild(ks);
  c.appendChild(g);
}

function paginaMapa(pg, c) {
  var g = el("div", "g-mapa");
  g.appendChild(visualMapa(pg, "Lugares por Distrito"));
  var ids = lugares(pg);
  var p = painel("", "Lugares (" + ids.length + ")");
  var l = el("div", "lista");
  if (!ids.length) { l.appendChild(el("div", "vazio", "Nenhum lugar com os filtros atuais")); }
  ids.forEach(function (e) {
    var it = el("article", "lugar");
    it.appendChild(el("span", "cat", e.segmentos_rotulo + " · " + e.distrito));
    it.appendChild(el("b", null, e.nome_empreendimento));
    if (e.endereco_completo) { it.appendChild(el("p", null, e.endereco_completo)); }
    var linha = [e.telefones, e.horario_atendimento && (e.dias_resumo + " · " + e.horario_atendimento)].filter(Boolean).join(" · ");
    if (linha) { it.appendChild(el("p", null, linha)); }
    l.appendChild(it);
  });
  p.appendChild(l);
  g.appendChild(p);
  c.appendChild(g);
}

var buscaContatos = "";
function paginaContatos(pg, c) {
  var g = el("div", "g-cont");
  var pj = painel("proj");
  pj.appendChild(el("h3", null, "Sobre os contatos"));
  pj.appendChild(el("p", null, "Contatos que os próprios estabelecimentos autorizaram publicar."));
  pj.appendChild(el("p", null, "Informações declaradas por eles. Confirme horário antes de ir."));
  g.appendChild(pj);

  var todos = lugares(pg);
  g.appendChild(visualKPI(pg, { titulo: "Canais de Contato", partes: [
    { tipo: "pct", ind: "__whats", cats: ["Sim"], rotulo: "têm WhatsApp" }, { tipo: "pct", ind: "__rede", cats: ["Sim"], rotulo: "têm Instagram ou site" }] }));
  if (PARCEIROS.length) {
    var pr = painel("", "Parceiros"); var box = el("div", "parceiros");
    PARCEIROS.forEach(function (x) { var im = el("img"); im.src = x.img; im.alt = x.nome; box.appendChild(im); });
    pr.appendChild(box); g.appendChild(pr);
  } else {
    g.appendChild(visualKPI(pg, { titulo: "Lugares na Lista", partes: [{ tipo: "conta", rotulo: "com os filtros atuais" }] }));
  }

  var tp = painel("tab-p", "Contatos dos Estabelecimentos");
  var bus = el("div", "busca");
  var inp = el("input"); inp.type = "search"; inp.placeholder = "Buscar por nome, endereço ou distrito"; inp.value = buscaContatos;
  inp.setAttribute("aria-label", "Buscar estabelecimento");
  var info = el("span");
  bus.appendChild(inp); bus.appendChild(info); tp.appendChild(bus);
  var tw = el("div", "tabela");
  var t = el("table"), th = el("thead"), tr = el("tr");
  ["Estabelecimento", "Categoria", "Distrito", "Telefone", "WhatsApp", "Instagram / site"].forEach(function (h) { tr.appendChild(el("th", null, h)); });
  th.appendChild(tr); t.appendChild(th);
  var tb = el("tbody"); t.appendChild(tb); tw.appendChild(t); tp.appendChild(tw);
  function preencher() {
    var q = normalizar(buscaContatos);
    var rows = todos.filter(function (e) { return !q || normalizar(e.busca + " " + e.nome_empreendimento).indexOf(q) >= 0; });
    tb.textContent = "";
    rows.forEach(function (e) {
      var r = el("tr");
      r.appendChild(el("td", null, e.nome_empreendimento));
      r.appendChild(el("td", null, e.segmentos_rotulo));
      r.appendChild(el("td", null, e.distrito));
      r.appendChild(el("td", null, e.telefones || "–"));
      var tdW = el("td");
      if (e.whatsapp) { var aw = el("a", null, "Conversar"); aw.href = "https://wa.me/" + e.whatsapp.replace(/\D/g, ""); aw.target = "_blank"; aw.rel = "noopener"; tdW.appendChild(aw); } else { tdW.textContent = "–"; }
      r.appendChild(tdW);
      var tdR = el("td");
      if (e.instagram) {
        var ai = el("a", null, "@" + e.instagram.replace(/^@/, ""));
        ai.href = /^https?:/i.test(e.instagram) ? e.instagram : "https://instagram.com/" + e.instagram.replace(/^@/, "");
        ai.target = "_blank"; ai.rel = "noopener"; tdR.appendChild(ai);
      }
      if (e.site && /^https?:/i.test(e.site)) {
        if (tdR.childNodes.length) { tdR.appendChild(document.createTextNode(" · ")); }
        var as = el("a", null, "site"); as.href = e.site; as.target = "_blank"; as.rel = "noopener"; tdR.appendChild(as);
      }
      if (!tdR.childNodes.length) { tdR.textContent = "–"; }
      r.appendChild(tdR);
      tb.appendChild(r);
    });
    info.textContent = rows.length + " de " + todos.length + " lugares";
  }
  inp.addEventListener("input", function () { buscaContatos = inp.value; preencher(); });
  preencher();
  g.appendChild(tp);
  c.appendChild(g);
}
/* indicadores derivados só para os canais de contato (existência de campo, não regra) */
FATO.__whats = {}; FATO.__rede = {};
EMPS.forEach(function (e) {
  FATO.__whats[e.id_empreendimento] = [e.whatsapp ? "Sim" : "Não"];
  FATO.__rede[e.id_empreendimento] = [(e.instagram || e.site) ? "Sim" : "Não"];
});

/* ---------- painel de filtros e ajuda ---------- */
function filtrosDe(pg) {
  var f = el("aside", "filtros"); f.id = "filtros"; f.setAttribute("aria-label", "Filtros da página");
  f.appendChild(el("h2", null, "Filtros"));
  (pg.slicers || []).forEach(function (k) {
    var s = el("div", "slicer");
    var id = "sl-" + k;
    var lb = el("label", null, SLICER_ESPECIAL[k] ? SLICER_ESPECIAL[k].rotulo : (ROTULO_SLICER[k] || (INDS[k] || {}).titulo || k));
    lb.htmlFor = id;
    var sel = el("select"); sel.id = id;
    var o0 = el("option", null, "Todos"); o0.value = ""; sel.appendChild(o0);
    var opcoes = SLICER_ESPECIAL[k] ? SLICER_ESPECIAL[k].opcoes() : categorias(k);
    opcoes.forEach(function (v) {
      var o = el("option", null, k === "localizacao" ? "Zona " + v.toLowerCase() : v); o.value = v; sel.appendChild(o);
    });
    sel.value = valorFiltro(pg, k);
    sel.addEventListener("change", function () { definirFiltro(pg, k, sel.value); filtrosAbertos = true; desenhar(); });
    s.appendChild(lb); s.appendChild(sel); f.appendChild(s);
  });
  if (estPag(pg).sel) {
    var aviso = el("p", "p-nota", "Também filtrado pelo gráfico: " + estPag(pg).sel.cat);
    aviso.style.textAlign = "left"; f.appendChild(aviso);
  }
  var ac = el("div", "f-acoes");
  var bl = el("button"); bl.type = "button"; bl.appendChild(icone("limpar")); bl.appendChild(el("span", null, "Limpar"));
  bl.addEventListener("click", function () { limparPagina(pg); filtrosAbertos = true; desenhar(); });
  var bv = el("button"); bv.type = "button"; bv.setAttribute("aria-label", "Fechar filtros"); bv.appendChild(icone("voltar")); bv.appendChild(el("span", null, "Fechar"));
  bv.addEventListener("click", alternarFiltros);
  ac.appendChild(bl); ac.appendChild(bv); f.appendChild(ac);
  return f;
}
var filtrosAbertos = false;
function alternarFiltros() {
  var f = document.getElementById("filtros"); if (!f) { return; }
  filtrosAbertos = !f.classList.contains("aberto");
  f.classList.toggle("aberto", filtrosAbertos);
  if (filtrosAbertos) { var s = f.querySelector("select"); if (s) { s.focus(); } }
}
function limparPagina(pg) {
  (pg.slicers || []).forEach(function (k) { definirFiltro(pg, k, ""); });
  estPag(pg).sel = null;
}
function limparTudo() { estado = { global: {}, pag: {} }; buscaContatos = ""; desenhar(); }

function ajudaDe(pg) {
  var a = el("div", "ajuda"); a.id = "ajuda"; a.setAttribute("aria-hidden", "true");
  a.addEventListener("click", function () { a.classList.remove("aberto"); });
  requestAnimationFrame(function () {
    var base = palco.getBoundingClientRect(), esc = escalaAtual();
    palco.querySelectorAll(".lat-item").forEach(function (b) {
      var r = b.getBoundingClientRect();
      var pgB = PAG[b.dataset.pagina];
      var txt = pgB ? pgB.ajuda : { filtrar: "Abre o menu de filtros", limpar: "Limpa os filtros de todas as páginas", ajuda: "Mostra estas legendas" }[b.dataset.acao];
      if (!txt) { return; }
      var rot = el("div", "rot", txt);
      rot.style.top = ((r.top + r.height / 2 - base.top) / esc - 150) + "px";
      a.appendChild(rot);
    });
  });
  return a;
}

/* ==================================================================
   7. Navegação, desenho e escala
   ================================================================== */
var atual = PAGINAS[0];
function ir(id) {
  if (!PAG[id]) { id = "inicio"; }
  if (location.hash.slice(1) !== id) { history.pushState(null, "", "#" + id); }
  atual = PAG[id]; filtrosAbertos = false; desenhar(); palco.scrollTop = 0;
  if (document.body.classList.contains("compacto")) { window.scrollTo(0, 0); }
}
window.addEventListener("popstate", function () { atual = PAG[location.hash.slice(1)] || PAGINAS[0]; filtrosAbertos = false; desenhar(); });

function desenhar() {
  var foco = document.activeElement && document.activeElement.id;
  palco.textContent = "";
  esconderDica();
  var pg = atual;
  document.title = (pg.tipo === "capa" ? "" : pg.nome + " · ") + "Turismo em Dados · Montanhas Capixabas";
  if (pg.tipo === "capa") { capa(); }
  else {
    var c = moldura(pg);
    if (pg.tipo === "segmento") { paginaSegmento(pg, c); }
    else if (pg.tipo === "contexto") { paginaContexto(pg, c); }
    else if (pg.tipo === "mapa") { paginaMapa(pg, c); }
    else if (pg.tipo === "contatos") { paginaContatos(pg, c); }
    if (pg.slicers) { var f = filtrosDe(pg); if (filtrosAbertos) { f.classList.add("aberto"); } palco.appendChild(f); }
    palco.appendChild(ajudaDe(pg));
  }
  document.getElementById("pag-nome").textContent = pg.nome + " (" + (pg.n + 1) + " de " + PAGINAS.length + ")";
  if (foco) { var n = document.getElementById(foco); if (n) { n.focus(); } }
}

document.getElementById("pag-ant").addEventListener("click", function () { ir(PAGINAS[(atual.n - 1 + PAGINAS.length) % PAGINAS.length].id); });
document.getElementById("pag-prox").addEventListener("click", function () { ir(PAGINAS[(atual.n + 1) % PAGINAS.length].id); });
document.getElementById("tela-cheia").addEventListener("click", function () {
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); } else { document.documentElement.requestFullscreen(); }
  } catch (e) { /* navegador sem suporte */ }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") {
    var a = document.getElementById("ajuda"); if (a) { a.classList.remove("aberto"); }
    var f = document.getElementById("filtros"); if (f && f.classList.contains("aberto")) { alternarFiltros(); }
  }
});

var moldEl = document.getElementById("moldura");
var _esc = 1;
function escalaAtual() { return document.body.classList.contains("compacto") ? 1 : _esc; }
function ajustar() {
  var compacto = innerWidth < 820 || innerHeight < 420;
  document.body.classList.toggle("compacto", compacto);
  if (compacto) { palco.style.transform = ""; palco.style.left = ""; palco.style.top = ""; return; }
  var w = moldEl.clientWidth, h = moldEl.clientHeight;
  _esc = Math.min(w / 1920, h / 1080);
  palco.style.transform = "scale(" + _esc + ")";
  palco.style.left = Math.max(0, (w - 1920 * _esc) / 2) + "px";
  palco.style.top = Math.max(0, (h - 1080 * _esc) / 2) + "px";
}
window.addEventListener("resize", ajustar);
ajustar();
atual = PAG[location.hash.slice(1)] || PAGINAS[0];
desenhar();
</script>
